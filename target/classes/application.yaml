server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:schedulingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

security:
  jwt:
    secret: bXktc3VwZXItc2VjcmV0LWtleS1tdXN0LWJlLWxvbmc=
    expiration-seconds: 3600
